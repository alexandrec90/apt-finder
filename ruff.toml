target-version = "py312"
line-length = 100
# `.agents/skills/` is generated from `.claude/skills/`; lint the source once.
extend-exclude = [".agents"]
force-exclude = true

[lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "T20", "N", "RUF"]
# E501 off everywhere, per `.claude/rules/engineering.md`: lint is for correctness and
# security, and "anything a formatter can decide" is off. `line-length` above still
# drives `ruff format`, so code is wrapped at 100 on every edit — the difference is that
# it happens silently instead of failing a commit.
#
# The rest of `E` stays on. E501 is the only cosmetic rule in it; E711/E722 and friends
# are real correctness checks.
#
# It was already ignored for `scripts/`, `tests/` and the skill payloads below, which is
# most of the tree — the residue was app code, where it fires on exactly the lines a
# formatter cannot split: long string literals and URLs. Enforcing there bought nothing
# and cost a blocked commit (a DSN that had to carry a `detect-secrets` pragma on the
# same line could not satisfy both the 100-column limit and the scanner).
ignore = ["E501"]

[lint.per-file-ignores]
# The CLI's entire interface is its stdout, so T201 (print) has nothing to say here.
# Same rationale as the `scripts/**` entry below; scoped to the one module that is a
# terminal program, so a stray print anywhere else in the package still fails.
"apt_finder/cli.py" = ["T201"]
# CLI / diagnostic tooling: terminal output (T201), terse loop vars (E741), and long
# regex/format lines (E501) are idiomatic here. These scripts orchestrate trusted
# first-party tools (git, ruff, docker) via subprocess, so the bandit
# subprocess/partial-path/urlopen warnings (S603/S607/S310) are expected.
"scripts/**/*.py" = ["T201", "E741", "E501", "S603", "S607", "S310"]
# Skill payload scripts (`.claude/skills/*/`) are CLI tools a skill shells out to and
# reads the stdout of, so printing is their entire interface. These arrive vendored
# from devkit, so this line must stay in step with devkit's own ruff.toml.
".claude/skills/**/*.py" = ["T201", "E741", "E501", "S603", "S607", "S310"]
# Tests: asserts (S101), long lines, and hardcoded test passwords (S105).
"tests/**/*.py" = ["E501", "S101", "S105"]
"scripts/hooks/tests/**/*.py" = ["E501", "S101", "S105"]

[format]
quote-style = "double"
